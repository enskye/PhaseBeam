plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace "com.android.phasebeam"

    defaultConfig {
        applicationId 'com.android.phasebeam'
        minSdk 31
        targetSdk 36
        versionCode 3
        versionName '1.5'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        archivesBaseName = "PhaseBeam-$versionName"
    }

    def signingKeystore = System.getenv("SIGNING_KEYSTORE")

    signingConfigs {
        if (signingKeystore) {
            release {
                storeFile file(signingKeystore)
                storePassword System.getenv("SIGNING_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "phasebeam"
                keyPassword System.getenv("SIGNING_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = false
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
